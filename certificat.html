<!DOCTYPE html>
<html>
<head>
<title>Certificate</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.certificate{
background:white;
width:800px;
padding:40px;
text-align:center;
border:15px solid gold;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
color:goldenrod;
font-size:50px;
margin-bottom:20px;
}

.name{
font-size:35px;
font-weight:bold;
color:#222;
margin:20px 0;
}

p{
font-size:20px;
}

.signature{
margin-top:50px;
display:flex;
justify-content:space-between;
}

button{
margin-top:30px;
padding:10px 20px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="certificate">
<h1>Certificate of Completion</h1>

<p>This Certificate is Proudly Presented To</p>

<div class="name">SREEJITH SURESHKUMAR</div>

<p>
For Successfully Completing the
Smart Learning Hub Program
</p>

<p>Date: 07-06-2026</p>

<div class="signature">
<div>
_____<br>
Instructor
</div>

<div>
_____<br>
Smart Learning Hub
</div>
</div>

<button onclick="window.print()">Download PDF</button>

</div>

</body>
</html>
